[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winstocker"
version = "0.1.0"
description = "A-share list and daily K-line initializer"
requires-python = ">=3.10"

[project.scripts]
winstock = "winstocker.cli:main"

[tool.setuptools]
packages = ["winstocker"]
